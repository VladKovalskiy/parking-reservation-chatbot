[project]
name = "parking-bot"
version = "0.1.0"
description = "RAG chatbot for parking space reservation"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- LangChain core ---
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-text-splitters",
    "langgraph",
    # --- LLM provider ---
    "langchain-anthropic",
    # --- Embeddings (local, multilingual) ---
    "langchain-huggingface",
    "sentence-transformers",
    # --- Vector store ---
    "langchain-milvus",
    "pymilvus",
    # --- Dynamic data (SQL) ---
    "sqlalchemy",
    "psycopg[binary]",
    # --- Guardrails / PII ---
    "presidio-analyzer",
    "presidio-anonymizer",
    # spaCy NER model presidio-analyzer's default NlpEngineProvider loads for
    # its NLP-based recognizers (PERSON, LOCATION, ...); pattern-based
    # recognizers (email, phone, ...) don't need it, but PERSON does.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # --- App / config ---
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parking_bot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services (Milvus/Postgres/API keys)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
